
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Formulário de cadastro pessoal."
    >

    <title>Cadastro Pessoal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <section class="form-card">

            <header class="form-header">
                <h1>Cadastro Pessoal</h1>
                <p>Preencha seus dados para realizar o cadastro.</p>
            </header>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="nome">Nome</label>
                            <input
                                type="text"
                                id="nome"
                                name="nome"
                                placeholder="Seu nome"
                                autocomplete="given-name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="sobrenome">Sobrenome</label>
                            <input
                                type="text"
                                id="sobrenome"
                                name="sobrenome"
                                placeholder="Seu sobrenome"
                                autocomplete="family-name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="nascimento">
                                Data de nascimento
                            </label>

                            <input
                                type="date"
                                id="nascimento"
                                name="nascimento"
                                autocomplete="bday"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="genero">Gênero</label>

                            <select id="genero" name="genero" required>
                                <option value="" selected disabled>
                                    Selecione
                                </option>

                                <option value="feminino">Feminino</option>
                                <option value="masculino">Masculino</option>
                                <option value="nao-informar">
                                    Prefiro não informar
                                </option>
                                <option value="outro">Outro</option>
                            </select>
                        </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Informações de contato</legend>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="email">E-mail</label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="voce@exemplo.com"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="telefone">Telefone</label>

                            <input
                                type="tel"
                                id="telefone"
                                name="telefone"
                                placeholder="(31) 99999-9999"
                                autocomplete="tel"
                                required
                            >
                        </div>

                    </div>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="cep">CEP</label>

                            <input
                                type="text"
                                id="cep"
                                name="cep"
                                placeholder="00000-000"
                                autocomplete="postal-code"
                                inputmode="numeric"
                                pattern="[0-9]{5}-?[0-9]{3}"
                                title="Informe um CEP válido, com 8 dígitos."
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="cidade">Cidade</label>

                            <input
                                type="text"
                                id="cidade"
                                name="cidade"
                                placeholder="Sua cidade"
                                autocomplete="address-level2"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="estado">Estado</label>

                            <select
                                id="estado"
                                name="estado"
                                autocomplete="address-level1"
                                required
                            >
                                <option value="" selected disabled>
                                    Selecione
                                </option>

                                <option value="AC">Acre</option>
                                <option value="AL">Alagoas</option>
                                <option value="AP">Amapá</option>
                                <option value="AM">Amazonas</option>
                                <option value="BA">Bahia</option>
                                <option value="CE">Ceará</option>
                                <option value="DF">Distrito Federal</option>
                                <option value="ES">Espírito Santo</option>
                                <option value="GO">Goiás</option>
                                <option value="MA">Maranhão</option>
                                <option value="MT">Mato Grosso</option>
                                <option value="MS">Mato Grosso do Sul</option>
                                <option value="MG">Minas Gerais</option>
                                <option value="PA">Pará</option>
                                <option value="PB">Paraíba</option>
                                <option value="PR">Paraná</option>
                                <option value="PE">Pernambuco</option>
                                <option value="PI">Piauí</option>
                                <option value="RJ">Rio de Janeiro</option>
                                <option value="RN">Rio Grande do Norte</option>
                                <option value="RS">Rio Grande do Sul</option>
                                <option value="RO">Rondônia</option>
                                <option value="RR">Roraima</option>
                                <option value="SC">Santa Catarina</option>
                                <option value="SP">São Paulo</option>
                                <option value="SE">Sergipe</option>
                                <option value="TO">Tocantins</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="rua">Rua e número</label>

                            <input
                                type="text"
                                id="rua"
                                name="rua"
                                placeholder="Rua, número e complemento"
                                autocomplete="street-address"
                                required
                            >
                        </div>

                    </div>
                </fieldset>

                <div class="form-group terms">
                    <input
                        type="checkbox"
                        id="termos"
                        name="termos"
                        required
                    >

                    <label for="termos">
                        Confirmo que os dados informados estão corretos.
                    </label>
                </div>

                <div class="form-actions">
                    <button type="reset" class="btn-secondary">
                        Limpar
                    </button>

                    <button type="submit" class="btn-primary">
                        Realizar cadastro
                    </button>
                </div>

            </form>

        </section>

    </main>

</body>
</html>
